      <h1>Students' Biennale</h1>
      <p>
        Established by the Kochi Biennale Foundation in 2014, the Students' Biennale is the
        foundation's flagship educational initiative and one of the most significant platforms for
        emerging artists in India. It runs parallel to each edition of the Kochi-Muziris Biennale,
        giving students and recent graduates from art institutions across India the chance to
        exhibit within an international contemporary art exhibition, through exhibitions,
        workshops, residencies, mentorship, talks, research projects, awards and international
        exchanges.
      </p>
