<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Students’ Biennale — Coming Soon</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      .stage {
        position: fixed;
        inset: 0;
      }

      .stage video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main class="stage" aria-label="Coming soon">
      <h1 class="sr-only">Students’ Biennale — Coming Soon</h1>
      <video
        src="./sb-coming-soon.mp4"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
      ></video>
    </main>
  </body>
</html>
