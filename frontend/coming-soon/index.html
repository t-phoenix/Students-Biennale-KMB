<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Students’ Biennale — Coming Soon</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        -webkit-tap-highlight-color: transparent;
      }

      .stage {
        position: fixed;
        inset: 0;
      }

      .stage video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        /* Avoid native media UI chrome on WebKit / mobile */
        pointer-events: none;
      }

      /* Hide iOS/Safari “tap to play” overlay when autoplay is deferred */
      .stage video::-webkit-media-controls {
        display: none !important;
        -webkit-appearance: none;
      }

      .stage video::-webkit-media-controls-start-playback-button {
        display: none !important;
        -webkit-appearance: none;
      }

      .stage video::-webkit-media-controls-enclosure {
        display: none !important;
      }

      .credit {
        position: absolute;
        left: 50%;
        bottom: clamp(0.75rem, 2.2vh, 1.5rem);
        transform: translateX(-50%);
        z-index: 2;
        width: min(92vw, 52rem);
        text-align: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial,
          sans-serif;
        font-size: clamp(0.625rem, 1.1vw, 0.75rem);
        font-weight: 400;
        line-height: 1.4;
        letter-spacing: 0.01em;
        color: #9a9a9a;
        pointer-events: none;
      }

      .credit a {
        color: inherit;
        text-decoration: none;
        pointer-events: auto;
        transition: color 0.15s ease;
      }

      .credit a:hover,
      .credit a:focus-visible {
        color: #5c5c5c;
        text-decoration: underline;
        text-underline-offset: 0.15em;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main class="stage" aria-label="Coming soon">
      <h1 class="sr-only">Students’ Biennale — Coming Soon</h1>
      <video
        id="coming-soon-video"
        muted
        autoplay
        loop
        playsinline
        webkit-playsinline
        disablepictureinpicture
        disableremoteplayback
        preload="auto"
        x-webkit-airplay="deny"
      >
        <source src="./sb-coming-soon.mp4" type="video/mp4" />
      </video>
      <p class="credit">
        © 2026
        <a
          href="https://www.kochimuzirisbiennale.org/"
          target="_blank"
          rel="noopener noreferrer"
          >Kochi Biennale Foundation</a
        >. All rights reserved. Designed and developed by
        <a
          href="https://www.thecrowtheory.com/"
          target="_blank"
          rel="noopener noreferrer"
          >The Crow Theory</a
        >.
      </p>
    </main>
    <script>
      (function () {
        var video = document.getElementById("coming-soon-video");
        if (!video) return;

        // Browsers gate autoplay on the muted *property*, not only the attribute.
        video.muted = true;
        video.defaultMuted = true;
        video.playsInline = true;
        video.setAttribute("muted", "");
        video.setAttribute("playsinline", "");
        video.setAttribute("webkit-playsinline", "");

        var playing = false;

        function markPlaying() {
          playing = true;
        }

        function tryPlay() {
          if (playing && !video.paused) return;

          video.muted = true;

          var attempt = video.play();
          if (attempt && typeof attempt.then === "function") {
            attempt.then(markPlaying).catch(function () {
              playing = false;
            });
          } else {
            markPlaying();
          }
        }

        video.addEventListener("playing", markPlaying);
        video.addEventListener("loadeddata", tryPlay);
        video.addEventListener("canplay", tryPlay);
        video.addEventListener("canplaythrough", tryPlay);

        // Resume after tab switch / lock screen / Low Power Mode recovery
        document.addEventListener("visibilitychange", function () {
          if (!document.hidden) tryPlay();
        });
        window.addEventListener("pageshow", tryPlay);
        window.addEventListener("focus", tryPlay);

        // iOS Low Power Mode / data-saver: first gesture unlocks muted playback
        // with no visible play button (stage captures the gesture).
        ["touchstart", "touchend", "pointerdown", "click", "keydown"].forEach(
          function (eventName) {
            document.addEventListener(eventName, tryPlay, {
              capture: true,
              passive: true,
            });
          }
        );

        tryPlay();
        // Delayed retries for slow mobile networks / deferred media policies
        setTimeout(tryPlay, 250);
        setTimeout(tryPlay, 1000);
        setTimeout(tryPlay, 2500);
      })();
    </script>
  </body>
</html>
