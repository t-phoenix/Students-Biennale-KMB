<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Students’ Biennale — Coming Soon</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      .stage {
        position: fixed;
        inset: 0;
      }

      .stage video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .credit {
        position: absolute;
        left: 50%;
        bottom: clamp(0.75rem, 2.2vh, 1.5rem);
        transform: translateX(-50%);
        z-index: 2;
        width: min(92vw, 52rem);
        text-align: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial,
          sans-serif;
        font-size: clamp(0.625rem, 1.1vw, 0.75rem);
        font-weight: 400;
        line-height: 1.4;
        letter-spacing: 0.01em;
        color: #9a9a9a;
        pointer-events: none;
      }

      .credit a {
        color: inherit;
        text-decoration: none;
        pointer-events: auto;
        transition: color 0.15s ease;
      }

      .credit a:hover,
      .credit a:focus-visible {
        color: #5c5c5c;
        text-decoration: underline;
        text-underline-offset: 0.15em;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main class="stage" aria-label="Coming soon">
      <h1 class="sr-only">Students’ Biennale — Coming Soon</h1>
      <video
        src="./sb-coming-soon.mp4"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
      ></video>
      <p class="credit">
        © 2026
        <a
          href="https://www.kochimuzirisbiennale.org/"
          target="_blank"
          rel="noopener noreferrer"
          >Kochi Biennale Foundation</a
        >. All rights reserved. Designed and developed by
        <a
          href="https://www.thecrowtheory.com/"
          target="_blank"
          rel="noopener noreferrer"
          >The Crow Theory</a
        >.
      </p>
    </main>
  </body>
</html>
